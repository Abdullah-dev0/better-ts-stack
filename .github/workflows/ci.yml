name: CI

on:
  pull_request:
  # Releases are pushed straight to main
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type:check
      - run: npm run build

  templates:
    name: Templates (${{ matrix.framework }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        framework: [express, nestjs, nextjs, tanstack]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Generated outside the repository so the projects do not pick up its configs
      - name: Generate every template combination
        run: npm run test:templates -- "$RUNNER_TEMP/matrix"
      - name: Install, build, type-check, and lint
        run: node scripts/check-matrix.cjs "$RUNNER_TEMP/matrix/matrix.json" ${{ matrix.framework }}
      - name: Start the built projects and check HTTP responses
        run: node scripts/smoke-matrix.cjs "$RUNNER_TEMP/matrix/matrix.json" ${{ matrix.framework }}
      # A sample of images, each against a real database. Linux only: the
      # Windows runners cannot run Linux containers
      - name: Build the Docker images and check them
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/docker-matrix.cjs "$RUNNER_TEMP/matrix/matrix.json" ${{ matrix.framework }}

  monorepos:
    name: Monorepos
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run test:templates -- "$RUNNER_TEMP/matrix"
      - name: Install, build, type-check, lint, and start the sampled monorepos
        run: node scripts/check-monorepo.cjs "$RUNNER_TEMP/matrix/matrix.json"
